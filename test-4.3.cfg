[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-4.3.x.cfg
    base.cfg
    versions-4.3.cfg

update-versions-file = test-4.3.cfg

index = https://pypi.org/simple/

eggs +=
    Products.DocFinderTab
    aws.zope2zcmldoc

# http://<your-zope-root>/@@install-aws-zope2zcmldoc

[versions]
# Not in versions-4.3.cfg (server.dmsmail pins), from scripts-buildout test-4.3.cfg
aws.zope2zcmldoc = 1.1.0
pdbpp = 0.10.3

# Required by:
# qa.cfg
pep517 = 0.8.2

# Added by buildout at 2023-03-07 15:07:25.523214
createcoverage = 1.5
isort = 4.3.21
futures = 3.4.0
mccabe = 0.6.1
plone.recipe.codeanalysis = 3.0.1
pyflakes = 2.3.1
testfixtures = 6.18.5

# Required by:
# pdbpp==0.10.3
fancycompleter = 0.9.1
pathtools = 0.1.2
pyrepl = 0.9.0
wmctrl = 0.4

# 1.2+ is Python 3 only (pdbp dependency)
tabcompleter = 1.1.0

# imio.dms.mail master requires imio.esign>=1.0.2 (versions-4.3.cfg: 1.0.0)
imio.esign = 1.0.3
# server.dmsmail checkouts without a pin in versions-4.3.cfg: latest Plone 4.3 releases
collective.contact.importexport = 1.0.0
eea.facetednavigation = 14.8
Products.CPUtils = 1.26.1
# the 0.1.3 sdist is named imio_fpaudit: the Python 2.7 egg gets that name and imio.dms.mail's
# includeDependencies doesn't find the 'imio.fpaudit' distribution
imio.fpaudit = 0.1.2
